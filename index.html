<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030303" />
  <title>CrystalizedHub — In Development</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --red: #ff1028;
      --white: #f6f6f6;
      --muted: #a9a9ad;
    }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--white);
      background: #020202;
      font-family: Inter, ui-rounded, "Arial Rounded MT Bold", "Segoe UI", Arial, sans-serif;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 16, 40, .08), transparent 34%),
        #020202;
    }

    .glow {
      position: absolute;
      border: 2px solid rgba(255, 21, 48, .72);
      border-radius: 42% 58% 68% 32% / 38% 42% 58% 62%;
      filter: blur(8px) drop-shadow(0 0 10px #ff1028) drop-shadow(0 0 24px rgba(255, 16, 40, .7));
      opacity: .75;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow.one {
      width: 460px; height: 270px;
      left: -160px; top: -90px;
      transform: rotate(-18deg);
    }

    .glow.two {
      width: 540px; height: 320px;
      right: -210px; top: 28%;
      border-color: rgba(0, 212, 255, .62);
      filter: blur(9px) drop-shadow(0 0 12px #00c8ff) drop-shadow(0 0 28px rgba(0, 200, 255, .55));
      animation-delay: -4s;
    }

    .glow.three {
      width: 420px; height: 220px;
      left: 20%; bottom: -145px;
      transform: rotate(18deg);
      animation-delay: -7s;
    }

    .glow.four {
      width: 260px; height: 150px;
      left: 33%; top: 7%;
      border-color: rgba(0, 212, 255, .55);
      filter: blur(9px) drop-shadow(0 0 12px #00c8ff);
      opacity: .42;
      animation-delay: -2s;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
    }

    header {
      width: min(1040px, calc(100% - 32px));
      margin: 24px auto 0;
      padding: 14px 18px 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 999px;
      background: rgba(4,4,4,.72);
      box-shadow: 0 12px 50px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
    }

    .brand {
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -.04em;
      text-decoration: none;
    }

    .brand span { color: var(--red); }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #b8b8bc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 13px var(--red);
      animation: pulse 1.8s infinite;
    }

    .small-join {
      padding: 10px 17px;
      color: #fff;
      border-radius: 999px;
      background: var(--red);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .small-join:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,16,40,.35); }

    main {
      min-height: calc(100vh - 90px);
      display: grid;
      place-items: center;
      padding: 70px 22px 110px;
      text-align: center;
    }

    .hero { max-width: 1040px; }

    .eyebrow {
      margin: 0 0 22px;
      color: #b7b7bb;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(52px, 8.5vw, 112px);
      font-weight: 900;
      line-height: .94;
      letter-spacing: -.07em;
    }

    h1 .top {
      display: block;
      color: #f5f5f5;
    }

    h1 .accent {
      display: inline-block;
      padding: 0 .08em .1em 0;
      color: var(--red);
      font-style: italic;
      letter-spacing: -.085em;
      text-shadow: 0 0 36px rgba(255, 16, 40, .16);
      transform: skewX(-4deg);
    }

    .description {
      max-width: 610px;
      margin: 30px auto 38px;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 20px);
      font-weight: 600;
      line-height: 1.55;
    }

    .discord-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 25px;
      color: #080808;
      background: #fff;
      border: 1px solid #fff;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 900;
      text-decoration: none;
      transition: transform .2s ease, color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .discord-button:hover {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
      transform: translateY(-3px);
      box-shadow: 0 13px 35px rgba(255,16,40,.28);
    }

    .discord-button:focus-visible,
    .small-join:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    .discord-button svg { width: 23px; height: 23px; fill: currentColor; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.72); }
    }

    @keyframes drift {
      from { translate: -12px -8px; rotate: -3deg; }
      to { translate: 24px 20px; rotate: 6deg; }
    }

    @media (max-width: 620px) {
      header { padding-left: 18px; }
      .status { display: none; }
      main { padding-top: 55px; }
      h1 { line-height: .98; }
      .description { margin-top: 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>
    <div class="glow four"></div>
  </div>
  <div class="noise" aria-hidden="true"></div>

  <header>
    <a class="brand" href="#">CRYSTALIZED<span>HUB</span></a>
    <div class="status"><i></i> In development</div>
    <a class="small-join" href="https://discord.gg/crystalized" target="_blank" rel="noopener noreferrer">Join Discord</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">Something special is coming</p>
      <h1>
        <span class="top">We are currently</span>
        <span class="accent">in development.</span>
      </h1>
      <p class="description">CrystalizedHub is being built right now. Join our Discord to follow the journey and be the first to know when we launch.</p>

      <a class="discord-button" href="https://discord.gg/crystalized" target="_blank" rel="noopener noreferrer" aria-label="Join the CrystalizedHub Discord server">
        <svg viewBox="0 0 127.14 96.36" aria-hidden="true">
          <path d="M107.7 8.07A105.2 105.2 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-9.39 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77.23 77.23 0 0 0 6.89 9.38 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 59.94 31 52.86s5-12.85 11.43-12.85 11.55 5.8 11.44 12.85c0 7.08-5.05 12.83-11.42 12.83Zm42.24 0c-6.27 0-11.44-5.75-11.44-12.83s5-12.85 11.44-12.85 11.54 5.8 11.43 12.85c0 7.08-5.05 12.83-11.43 12.83Z"/>
        </svg>
        Join our Discord
      </a>
    </section>
  </main>
</body>
</html>
